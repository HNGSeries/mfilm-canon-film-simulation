name: M-Film camera

# Builds the camera files (Magic Lantern + Film OS) for every camera in ml-dev/cameras.txt
# that is "working", "issues" or "testing". (Darkrooms, the desktop program, is built in its
# own repository.)
#   git tag v0.1.0 && git push origin v0.1.0     builds and publishes the zips under Releases
#                                                (the tag must match the VERSION file)
#   Actions > "M-Film camera" > Run workflow     builds and keeps the zips as artifacts; with a
#                                                tag in the box it publishes them as well
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish the builds under (leave empty to only build)"
        required: false
        default: ""
  push:
    tags: ["v*"]
    branches: ["main"]
    paths: ["ml-dev/**", "VERSION", ".github/workflows/camera.yml"]
  pull_request:
    paths: ["ml-dev/**", "VERSION", ".github/workflows/camera.yml"]

permissions:
  contents: write

jobs:
  # the darkroom on the PC simulator, on a card of rolls it has to find or explain: shot as JPEG,
  # Adobe RGB with a file deleted, across the IMG_9999 wrap; then Delete roll on them, and a card
  # that can't take long folder names (ml-dev/filmos/sim/cardtest.sh). Then colour: the sample RAW
  # as the darkroom has it before the film stock, against LibRaw's, and blown highlights on made-up
  # frames that clip below and above the camera's white level (ml-dev/filmos/sim/colourtest.py). And
  # the films' colour tables: every film has one, and a film without one fails and says so (tabletest.sh);
  # and the tone the Film-Luts tables are fed has the contrast of the camera's own JPEG (tonetest.py).
  # Last, the compare half of the measuring command: chart patches in two sets of pictures, on a
  # paired shot that is drawn because none has been shot (ml-dev/films/measuretest.py)
  darkroom:
    runs-on: ubuntu-24.04
    name: darkroom (simulator)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python for the film tables
        run: python -m pip install -q numpy scipy pillow rawpy
      - name: Build the simulator
        run: make -C ml-dev/filmos/sim out/sim out/devtest out/mkcr2 out/tables/TABLES.txt
      - name: Develop the problem rolls
        run: bash ml-dev/filmos/sim/cardtest.sh
      - name: The darkroom's colour against LibRaw
        run: python ml-dev/filmos/sim/colourtest.py
      - name: The films' colour tables
        run: bash ml-dev/filmos/sim/tabletest.sh
      - name: What the Film-Luts tables are fed
        run: python ml-dev/filmos/sim/tonetest.py
      - name: A picture in the docs for every film on the shelf
        run: python ml-dev/films/pictures.py --list
      - name: The measuring command on a made-up paired shot
        run: python ml-dev/films/measuretest.py

  camera:
    strategy:
      fail-fast: false
      matrix:
        platform: [EOSM.202, 5D2.212, 5D3.113, 5D3.123, 6D.116, 50D.109, 60D.111, 70D.112, 100D.101, 500D.111, 550D.109, 600D.102, 650D.104, 700D.115, 1100D.105, 1300D.110]  # from ml-dev/cameras.txt
    runs-on: ubuntu-24.04
    name: camera ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # ML's module build still imports distutils (gone in 3.12)
      - name: Toolchain and Magic Lantern (the commit the fork is made against)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi zip qemu-user
          python -m pip install -q numpy scipy pillow segno docutils
          git clone -q --filter=blob:none https://github.com/reticulatedpines/magiclantern_simplified.git "$HOME/ml/magiclantern_simplified"
          git -C "$HOME/ml/magiclantern_simplified" checkout -q ed3e7c0dfacfdeaf3349dee73edf9e3621217462
          arm-none-eabi-gcc --version | head -1
      - name: Build
        # the film OS as a module (ML/modules/filmos.mo, loaded after boot): on every camera since 0.2
        run: bash ml-dev/build_fork.sh ${{ matrix.platform }}
      - name: Zip
        run: |
          p=${{ matrix.platform }}
          if [ "$p" = EOSM.202 ]; then d=ml-dev/out/fork; else d=ml-dev/out/fork-$p; fi
          cp ml-dev/CAMERA-README.txt "$d/M-FILM-README.txt"
          # the licence and the notices travel with the binaries (GPL-2.0 section 1; the credit and the
          # CC BY-SA 4.0 notice of Pat David's tables, which 59 of the colour tables in ML/ are made from,
          # and Film-Luts' own MIT notice)
          cp LICENSE "$d/LICENSE.txt"
          cp THIRD_PARTY.md "$d/THIRD_PARTY.txt"
          (cd "$d" && zip -qr "$GITHUB_WORKSPACE/M-Film-camera-$p.zip" .)
          ls -la M-Film-camera-$p.zip
      - uses: actions/upload-artifact@v4
        with:
          name: M-Film-camera-${{ matrix.platform }}
          path: M-Film-camera-${{ matrix.platform }}.zip
          if-no-files-found: error
      # every film's colour table and the list of them (file, film, source, SHA-256), for the desktop
      # darkroom: the same bytes as in every zip's ML/DARKROOM, so both develop with the same tables.
      # Made once, from the EOS M's build: the tables don't depend on the camera.
      - name: The films' colour tables, on their own
        if: ${{ matrix.platform == 'EOSM.202' }}
        run: |
          mkdir tables
          cp ml-dev/out/fork/ML/DARKROOM/LOOK*.LUT ml-dev/out/TABLES.txt tables/
          cp LICENSE tables/LICENSE.txt
          cp THIRD_PARTY.md tables/THIRD_PARTY.txt
          (cd tables && sha256sum LOOK*.LUT > SHA256SUMS && zip -qr "$GITHUB_WORKSPACE/M-Film-tables.zip" .)
          ls -la M-Film-tables.zip
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.platform == 'EOSM.202' }}
        with:
          name: M-Film-tables
          path: M-Film-tables.zip
          if-no-files-found: error

  # builds for testers, not for releases. Their artifacts are named test-..., which the release leaves out.
  camera-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: 6D.116,   flags: --no-darkroom, suffix: -nodark }
    runs-on: ubuntu-24.04
    name: camera ${{ matrix.platform }}${{ matrix.suffix }} (for testing)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # ML's module build still imports distutils (gone in 3.12)
      - name: Toolchain and Magic Lantern (the commit the fork is made against)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi zip qemu-user
          python -m pip install -q numpy scipy pillow segno docutils
          git clone -q --filter=blob:none https://github.com/reticulatedpines/magiclantern_simplified.git "$HOME/ml/magiclantern_simplified"
          git -C "$HOME/ml/magiclantern_simplified" checkout -q ed3e7c0dfacfdeaf3349dee73edf9e3621217462
          arm-none-eabi-gcc --version | head -1
      - name: Build
        run: bash ml-dev/build_fork.sh ${{ matrix.platform }} ${{ matrix.flags }}
      - name: Zip
        run: |
          p=${{ matrix.platform }}
          d=ml-dev/out/fork-$p${{ matrix.suffix }}
          cp ml-dev/CAMERA-README.txt "$d/M-FILM-README.txt"
          # the licence and the notices travel with the binaries (GPL-2.0 section 1; the credit and the
          # CC BY-SA 4.0 notice of Pat David's tables, which 59 of the colour tables in ML/ are made from,
          # and Film-Luts' own MIT notice)
          cp LICENSE "$d/LICENSE.txt"
          cp THIRD_PARTY.md "$d/THIRD_PARTY.txt"
          (cd "$d" && zip -qr "$GITHUB_WORKSPACE/M-Film-camera-$p${{ matrix.suffix }}.zip" .)
          ls -la M-Film-camera-$p${{ matrix.suffix }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: test-M-Film-camera-${{ matrix.platform }}${{ matrix.suffix }}
          path: M-Film-camera-${{ matrix.platform }}${{ matrix.suffix }}.zip
          if-no-files-found: error

  release:
    needs: [darkroom, camera]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the VERSION file's
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          want="v$(tr -d ' \r\n' < VERSION)"
          [ "$tag" = "$want" ] || { echo "tag $tag but VERSION says $want: change one of them"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          pattern: M-Film-*             # the cameras' zips and the tables; not the test-... builds
          path: zips
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: M-Film ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          # the README's Download links go to releases/latest; Darkrooms' releases here never take it
          make_latest: true
          files: zips/*.zip
          body: |
            **On the camera** (`M-Film-camera-<camera>.zip`): the Film OS with Magic Lantern. Unzip it onto the card
            and run *Firmware ver.* → update once (see M-FILM-README.txt in the zip). How far testers have got on
            each camera, and what's still wrong, is in the README's camera table: see TESTING.md before you put it
            on a camera nobody has tried yet. Every zip has the in-camera darkroom. The film OS is a module on
            every camera (ML/modules/filmos.mo, loaded after boot): one zip a camera.

            **The films' colour tables** (`M-Film-tables.zip`): every film's table as the cameras' zips carry them
            in ML/DARKROOM, with a list of them and their checksums. The desktop darkroom reads the same files,
            so both give the same colour. You don't need this zip for a camera.

            The colour tables of 59 films are adapted from film emulation tables by Pat David and are licensed
            CC BY-SA 4.0, not GPL-2.0: THIRD_PARTY.txt in every zip says which, what was changed and what you may do.
