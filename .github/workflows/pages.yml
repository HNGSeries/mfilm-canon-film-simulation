name: mfilm.app

# The website (site/) on GitHub Pages, with the film OS built for the browser:
# the same screens as the camera, compiled to WebAssembly (ml-dev/filmos/web).
# Settings > Pages > Source must be "GitHub Actions"; the domain is site/CNAME.
on:
  push:
    branches: ["main"]
    # every file the site is made from (ml-dev/filmos/web/build.sh and sitedata.py read them)
    paths: ["site/**", "ml-dev/filmos/**", "ml-dev/films/**", "ml-dev/references/**", "ml-dev/cameras.txt",
            "FILMS.md", "VERSION", "LICENSE", "THIRD_PARTY.md", "docs/films/**", "docs/images/**",
            ".github/workflows/pages.yml"]
  pull_request:
    # ml-dev/films: the colour tables on the page's card come from there, and the check below develops with them
    paths: ["site/**", "ml-dev/filmos/**", "ml-dev/films/**", "ml-dev/cameras.txt", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Toolchain (clang for WebAssembly, WASI libc, Binaryen)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld wasi-libc libclang-rt-18-dev-wasm32 binaryen
          python -m pip install -q numpy scipy pillow
      - name: Build the film OS for the browser
        run: bash ml-dev/filmos/web/build.sh site/fos
      # The page as a visitor uses it: a roll loaded, shot and developed in a headless browser (#143).
      # A page that can't develop isn't published. Tried a second time before it fails, so that a
      # browser that was only slow doesn't hold the site back.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The page shoots and develops a roll
        run: |
          npm install --no-save --no-package-lock --silent playwright@1.64.1
          npx playwright install --with-deps chromium
          node ml-dev/filmos/web/pagetest.mjs site || { echo "once more"; node ml-dev/filmos/web/pagetest.mjs site; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
